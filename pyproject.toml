[project]
name = "signoz-cli"
version = "0.2.0"
description = "SigNoz CLI - query traces, logs, metrics, alerts, dashboards and services from SigNoz 0.138+"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
signoz = "signoz_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoz_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# CLI commands intentionally funnel all errors through _handle_error
"src/signoz_cli/main.py" = ["BLE001"]
