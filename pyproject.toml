[project]
name = "signoz-cli"
version = "0.5.29"
description = "SigNoz CLI - query traces, logs, metrics, alerts, dashboards and services from SigNoz 0.138+"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=2,<3",
    "rich>=13.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.0",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
]

[project.scripts]
signoz = "signoz_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signoz_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: integration tests that need a running SigNoz instance",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9, F) plus import-sorting (I), bugbear (B),
# pyupgrade (UP) and blind-except (BLE) so the per-file BLE001 ignore below
# is actually active. (Bare "E" would also pull in E501 line-length noise.)
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# CLI commands intentionally funnel all errors through _handle_error
"src/signoz_cli/main.py" = ["BLE001"]
"src/signoz_cli/commands/*.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
