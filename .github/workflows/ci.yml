name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[dev]' mypy
      - name: Ruff check
        run: ruff check .
      - name: Mypy
        run: mypy src/signoz_cli/

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  package:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  release:
    name: Auto-release (semver patch bump)
    needs: [lint, test, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Check commit message
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -qE '^\[skip release\]|^chore: bump version'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install build tools
        if: steps.check.outputs.skip != 'true'
        run: pip install build twine

      - name: Compute next semver patch
        if: steps.check.outputs.skip != 'true'
        id: version
        run: |
          # Get latest tag (by semver sort), fallback to v0.0.0
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest_tag=$LATEST" >> "$GITHUB_OUTPUT"

          # Parse major.minor.patch
          TAG_NUM="${LATEST#v}"
          MAJOR=$(echo "$TAG_NUM" | cut -d. -f1)
          MINOR=$(echo "$TAG_NUM" | cut -d. -f2)
          PATCH=$(echo "$TAG_NUM" | cut -d. -f3)

          # Bump patch
          NEXT_PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NEXT_NUM="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "next_num=$NEXT_NUM" >> "$GITHUB_OUTPUT"

          echo "Latest tag: $LATEST -> Next: $NEXT"

      - name: Bump version in source files
        if: steps.check.outputs.skip != 'true'
        run: |
          NEXT="${{ steps.version.outputs.next_num }}"
          echo "Bumping to $NEXT"
          sed -i "s/^version = .*/version = \"$NEXT\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$NEXT\"/" src/signoz_cli/__init__.py

      - name: Commit version bump
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/signoz_cli/__init__.py
          git diff --cached --quiet && echo "No version changes to commit" && exit 0
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
          git push

      - name: Create and push tag
        if: steps.check.outputs.skip != 'true'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "Tag $NEXT already exists, skipping tag creation."
          else
            git tag "$NEXT"
            git push origin "$NEXT"
          fi

      - name: Verify tag matches package version
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.next_num }}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: Tag version '$TAG' does not match package version '$PKG'." >&2
            exit 1
          fi
          echo "Tag $TAG matches package version $PKG."

      - name: Build sdist and wheel
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test wheel install
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/signoz --version

      - name: Upload artifacts to Forgejo release
        if: steps.check.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          HOST="http://localhost:3001"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${{ steps.version.outputs.next }}"

          # Get or create release
          RID=$(curl -s "$HOST/api/v1/repos/$REPO/releases/tags/$TAG" \
            -H "Authorization: token $TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))' 2>/dev/null || true)

          if [ -z "$RID" ] || [ "$RID" = "" ] || [ "$RID" = "None" ]; then
            echo "Release for $TAG does not exist; creating."
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": "Release " + sys.argv[1]}))' "$TAG")
            RID=$(curl -s -X POST "$HOST/api/v1/repos/$REPO/releases" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "release id: $RID"

          for f in dist/*; do
            NAME=$(basename "$f")
            echo "uploading $NAME"
            curl -s -X POST \
              "$HOST/api/v1/repos/$REPO/releases/$RID/assets?name=$NAME" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f"
            echo
          done

          echo "Release $TAG uploaded successfully."
