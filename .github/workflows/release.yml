name: Release

# Triggered by the tag push from the Bump version workflow (Forgejo's own
# release process works the same way: push tag -> build -> publish).
# cancel-in-progress: false per
# https://forgejo.org/docs/latest/user/actions/reference/ ("If you're
# performing releases of artifacts from a branch, then you may want to
# ensure each event's workflow is completed without being superseded").
on:
  push:
    tags: ["v*"]

concurrency:
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match package version '${PKG}'." >&2
            echo "Bump pyproject.toml (and src/signoz_cli/__init__.py) to match, or fix the tag." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${PKG}."

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/signoz --version

      - name: Upload artifacts to Forgejo release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          HOST="http://localhost:3001"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"

          RID=$(curl -s "$HOST/api/v1/repos/$REPO/releases/tags/$TAG" \
            -H "Authorization: token $TOKEN" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))' 2>/dev/null || true)

          if [ -z "$RID" ] || [ "$RID" = "" ] || [ "$RID" = "None" ]; then
            echo "Release for $TAG does not exist; creating."
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": "Release " + sys.argv[1]}))' "$TAG")
            RID=$(curl -s -X POST "$HOST/api/v1/repos/$REPO/releases" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "release id: $RID"

          for f in dist/*; do
            NAME=$(basename "$f")
            echo "uploading $NAME"
            curl -s -X POST \
              "$HOST/api/v1/repos/$REPO/releases/$RID/assets?name=$NAME" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f"
            echo
          done

          echo "Release $TAG uploaded successfully."
