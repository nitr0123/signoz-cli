name: Release

# Called by the Bump version workflow after it pushes a tag, or triggered
# by a tag pushed by hand. cancel-in-progress: false so a release run is
# never superseded halfway through publishing.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          TAG="${TAG#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag 'v${TAG}' does not match package version '${PKG}'." >&2
            echo "Bump pyproject.toml (and src/signoz_cli/__init__.py) to match, or fix the tag." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${PKG}."

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/signoz --version

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes "Release $TAG"
          fi
