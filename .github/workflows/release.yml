name: Release

# Dispatched by the Bump version workflow after it pushes a tag, or
# triggered by a tag pushed by hand. cancel-in-progress: false so a release run is
# never superseded halfway through publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.5.44)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          TAG="${TAG#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag 'v${TAG}' does not match package version '${PKG}'." >&2
            echo "Bump pyproject.toml (and src/signoz_cli/__init__.py) to match, or fix the tag." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package version ${PKG}."

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/signoz --version

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes "Release $TAG"
          fi

  pypi:
    name: Publish to PyPI
    needs: release
    # Off until the PyPI trusted publisher is registered for this repo and
    # workflow (environment "pypi"); then set repo variable PYPI_PUBLISH=true.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/signoz-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p '*.whl' -p '*.tar.gz'

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
